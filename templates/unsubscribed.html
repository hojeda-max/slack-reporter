<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Suscripción cancelada</title>
<style>
  body { font-family: -apple-system, sans-serif; display: flex; align-items: center;
         justify-content: center; min-height: 100vh; background: #f8f8f8; }
  .card { background: white; border-radius: 12px; padding: 48px 40px; max-width: 420px;
          width: 100%; box-shadow: 0 2px 16px rgba(0,0,0,.08); text-align: center; }
  h1 { font-size: 20px; color: #1a1d23; margin-bottom: 12px; }
  p  { color: #666; font-size: 15px; margin-bottom: 24px; }
  a  { color: #4A154B; font-size: 14px; }
</style>
</head>
<body>
<div class="card">
  <h1>Suscripción cancelada</h1>
  <p>{{ display_name }}, ya no vas a recibir más reportes de Slack.</p>
  <a href="/">Volver a suscribirte →</a>
</div>
</body>
</html>
